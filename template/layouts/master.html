    <script>
      function affiche_mdp() {
        var codes = document.getElementById("katsaka");
        var maso = document.getElementById("maso");

        if (codes.type === "password") {
          codes.type = "text";
          maso.classList.replace("fa-eye-slash", "fa-eye");
        }
      }
    </script>
    <script>

    </script>
    <script>
      function affiche_mdp() {
        var mdpd = document.querySelector("input-conex");
        var icones = document.querySelector("mdphide");

        if (mdpd && icones) {
          if (mdpd.type === "password") {
            mdpd.type = "text";
            icones.classList.replace("fa-eye-slash", "fa-eye");
          } else {
            mdpd.type === "password";
            icones.classList.replace("fa-eye", "fa-eye-slash");
          }
        } else {
          console.error("element non touvé");
        }
      }
    </script>

        margin: 15,
        nav: true,

        autoplayTimeout: 2800,
        autoplayHoverPause: true,
        responsive: {
          0: {
            items: 1,
          },
          600: {
            items: 2,
          },
          1000: {
            items: 3,
          },
        },
      });
      var toastTrigger = document.getElementById("liveToastBtn");
      var toastLiveExample = document.getElementById("liveToast");
      if (toastTrigger) {
        toastTrigger.addEventListener("click", function () {
          var toast = new bootstrap.Toast(toastLiveExample);

          toast.show();
        });
      }

      AOS.init({
        duration: 1200, // Duration of animations (in milliseconds)
        once: true, // Whether animation should happen only once - while scrolling down
        mirror: false, // Whether elements should animate out while scrolling past them
