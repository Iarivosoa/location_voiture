{% extends "layouts/master.html" %}
{% load static %}

{% block 'contenu' %}

<script>
    var MainImg = document.getElementById("MainImg")
    var smallImg = document.getElementsByClassName("small-img")
    smallImg[0].onclick = function(){
        MainImg.src = smallImg[0].src;
    }
    smallImg[1].onclick = function(){
        MainImg.src = smallImg[1].src;
    }
    smallImg[2].onclick = function(){
        MainImg.src = smallImg[2].src;
    }
    smallImg[3].onclick = function(){
        MainImg.src = smallImg[3].src;
    }
    smallImg[4].onclick = function(){
        MainImg.src = smallImg[4].src;
    }
</script>

<div class="container py-5">
  <div class="row justify-content-center align-items-center g-5">
    <div class="col-lg-6 col-md-10">
      <div class="card shadow-lg border-0 rounded-4 bg-dark text-white">
        <div class="card-body p-4">
          <div class="mb-4 text-center">
            <img src="{{detail.photo.url}}" alt="" class="img-fluid rounded-3 border border-3 border-primary" id="MainImg" style="max-width: 100%; max-height: 350px; object-fit: cover; box-shadow: 0 8px 32px 0 rgba(31,38,135,0.37);">
          </div>
          <div class="d-flex justify-content-center gap-2 mb-4 flex-wrap">
            <div class="fils smallImg"> <img src="{{detail.photo.url}}" alt="" width="80" class="small-img rounded shadow-sm border border-2 border-light"></div>
            <div class="fils smallImg"> <img src="{{detail.photo2.url}}" alt="" width="80" class="small-img rounded shadow-sm border border-2 border-light"></div>
            <div class="fils smallImg"> <img src="{{detail.photo3.url}}" alt="" width="80" class="small-img rounded shadow-sm border border-2 border-light"></div>
            <div class="fils smallImg"> <img src="{{detail.photo4.url}}" alt="" width="80" class="small-img rounded shadow-sm border border-2 border-light"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-lg-6 col-md-10">
      <div class="card shadow-lg border-0 rounded-4 bg-white h-100">
        <div class="card-body p-5">
          <h2 class="fw-bold text-primary mb-3">{{detail.nom}}</h2>
          <h5 class="text-secondary mb-3">{{detail.types}}</h5>
          <p class="mb-4 text-dark" style="font-size:1.1rem;">{{detail.description}}</p>
          <div class="d-flex flex-column gap-3 mt-4">
            {% if request.session.client %}
              <a href="{% url 'reservation' detail.id %}" class="btn btn-lg btn-warning fw-bold shadow">Réserver</a>
            {% else %}
              <a href="{% url 'page_connexion' %}" class="btn btn-lg btn-warning fw-bold shadow">Réserver</a>
            {% endif %}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<style>
  body {
    background: linear-gradient(120deg, #232526 0%, #414345 100%);
    min-height: 100vh;
  }
  .card.bg-dark {
    background: rgba(30,34,40,0.95)!important;
    border: none;
  }
  .card.bg-white {
    background: rgba(255,255,255,0.97)!important;
    border: none;
  }
  .small-img {
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .small-img:hover {
    transform: scale(1.08);
    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    border-color: #0d6efd!important;
  }
</style>
{% endblock 'contenu' %}
